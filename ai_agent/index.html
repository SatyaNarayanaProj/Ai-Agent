<!DOCTYPE html>
<html>
<head>
    <title>AI Announcement Generator</title>
    <style>
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #autocomplete {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            width: 300px;
            display: none;
            z-index: 10;
        }

        .item {
            padding: 8px;
            cursor: pointer;
        }

        .item:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<h2>Enter Title</h2>

<div style="position: relative; width: 420px;">
    <div class="row">
        <input type="text" id="title" autocomplete="off" style="width:300px;">
        <button id="generate">Generate</button>
    </div>
    <div id="autocomplete"></div>
</div>

<h3>Description</h3>
<p id="desc"></p>

<script>
const input = document.getElementById("title");
const box = document.getElementById("autocomplete");
const cache = {};
let lastRenderedKey = "";
let debounceTimer;

input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const value = input.value.trim().toLowerCase();

    if (value.length < 3) {
        box.style.display = "none";
        lastRenderedKey = "";
        return;
    }

    debounceTimer = setTimeout(async () => {

        // 🚫 Prevent re-render for same input
        if (value === lastRenderedKey) return;

        // ✅ Use cache
        if (cache[value]) {
            renderSuggestions(cache[value], value);
            return;
        }

        // 🌐 Call backend only once per unique input
        const res = await fetch(
            `http://127.0.0.1:8000/suggest?q=${encodeURIComponent(value)}`
        );
        const data = await res.json();

        if (!data.suggestions) return;

        cache[value] = data.suggestions;
        renderSuggestions(data.suggestions, value);

    }, 400);
});

function renderSuggestions(suggestions, key) {
    if (key === lastRenderedKey) return;

    box.innerHTML = "";

    suggestions.forEach(text => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerText = text;
        div.onclick = () => {
            input.value = text;
            box.style.display = "none";
        };
        box.appendChild(div);
    });

    box.style.display = "block";
    lastRenderedKey = key;
}

document.addEventListener("click", (e) => {
    if (e.target !== input) box.style.display = "none";
});

document.getElementById("generate").onclick = async () => {
    const title = input.value;
    const res = await fetch("http://127.0.0.1:8000/generate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ title })
    });
    const data = await res.json();
    document.getElementById("desc").innerText = data.description;
};
</script>

</body>
</html>
